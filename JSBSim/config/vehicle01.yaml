vehicle:
  sysid: 1
  mesh_node: aircraft-01
  model: c172x

spawn:
  latitude_deg: -34.98106
  longitude_deg: 117.85201
  altitude_msl_m: 140.0
  terrain_elevation_m: 40.0
  heading_deg: 0.0
  airspeed_mps: 30.0

simulation:
  rate_hz: 400
  status_hz: 5
  realtime: true

