# listener.  Later replace host/port with the target LQ node endpoint.
mavlink:
  enabled: true
  host: 127.0.0.1
  port: 14560
  sensor_rate_hz: 200
  gps_rate_hz: 10
  system_id: 1
  component_id: 200
